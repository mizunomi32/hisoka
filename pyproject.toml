[project]
name = "hisoka"
version = "0.1.0"
description = "ローカル完結の会議録音・議事録アプリ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mitsuhiro", email = "mizuno@mz32.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.3",
    "sounddevice>=0.5.6",
]

[project.scripts]
hisoka = "hisoka:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
